<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Dashboard</title>
  <link rel="stylesheet" href="GridDashboard.css">
</head>
<body>
  <div class="container">

    <header class="header">
      <h1>Study Dashboard</h1>
    </header>

    <nav class="sidebar">
      <h3>Menu</h3>
      <ul>
        <li>Overview</li>
        <li>Courses</li>
        <li>Profile</li>
      </ul>
    </nav>

    <main class="cards">
      <div class="card">
        <span class="icon">📚</span>
        <b>6</b>
        <p>Courses</p>
      </div>
      <div class="card">
        <span class="icon">⏰</span>
        <b>24 hrs</b>
        <p>Study Time</p>
      </div>
      <div class="card">
        <span class="icon">📝</span>
        <b>12</b>
        <p>Assignments</p>
      </div>
      <div class="card">
        <span class="icon">🏆</span>
        <b>8.7</b>
        <p>CGPA</p>
      </div>
      <div class="card">
        <span class="icon">🔥</span>
        <b>15 days</b>
        <p>Streak</p>
      </div>
      <div class="card">
        <span class="icon">🎯</span>
        <b>78%</b>
        <p>Goal Done</p>
      </div>
    </main>

    <footer class="footer">
      <p>Built with HTML and CSS Grid</p>
    </footer>

  </div>
</body>
</html>
